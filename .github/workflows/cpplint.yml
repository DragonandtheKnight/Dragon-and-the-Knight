name: cpplint

on:
  push:
  pull_request:

jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cpplint
        run: pip install cpplint==2.0.2

      - name: Run cpplint
        run: cpplint --recursive src test
